[tool.uv.workspace]
members = [
    "client",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "PLW", "RUF"]
ignore = [
    "B008", # typer declares CLI options as argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["silo"]
