[project]
name = "silo"
version = "0.1.0"
description = "A C++ package manager that builds dependencies from source into a local store"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "filelock>=3.29.0",
    "pydantic>=2.12",
    "tomli-w>=1.2",
    "typer>=0.25.1",
    "xxhash>=3.7.0",
]


[project.scripts]
silo = "silo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silo"]


[dependency-groups]
dev = [
    "pytest>=8.4",
]
